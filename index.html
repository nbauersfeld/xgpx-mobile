<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Letzte Strecken</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #f4f5f7; --karte: #ffffff; --text: #16202a; --matt: #64707d;
    --linie: #e4572e; --zweite: #2f6fd6; --rand: #dfe3e8; --hinweis: #fff4d6; --hinweis-text: #6b5300; --start: #2e9e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1720; --karte: #18222d; --text: #e8edf2; --matt: #93a1af;
      --linie: #ff7a50; --zweite: #6ea8ff; --rand: #263240; --hinweis: #3a3215; --hinweis-text: #f3d98a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1720; --karte: #18222d; --text: #e8edf2; --matt: #93a1af;
    --linie: #ff7a50; --zweite: #6ea8ff; --rand: #263240; --hinweis: #3a3215; --hinweis-text: #f3d98a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .hinweis { background: var(--hinweis); color: var(--hinweis-text); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  .hinweis:empty { display: none; }
  header { display: flex; align-items: center; gap: 8px; margin: 4px 2px 12px; }
  header div { flex: 1; min-width: 0; }
  h1 { font-size: 22px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wann { color: var(--matt); font-size: 14px; }
  button { font: inherit; color: var(--text); background: var(--karte); border: 1px solid var(--rand);
    border-radius: 10px; min-width: 44px; height: 44px; cursor: pointer; }
  .navi { display: flex; align-items: center; justify-content: center; gap: 12px; margin: -4px 0 10px; }
  .navi:empty, .navi[hidden] { display: none; }
  .navi button { height: 34px; min-width: 44px; }
  .navi span { color: var(--matt); font-size: 14px; font-variant-numeric: tabular-nums; min-width: 4em; text-align: center; }
  .geraete { color: var(--matt); font-size: 13px; margin-top: 6px; }
  .geraete:empty { display: none; }
  .geraete i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin: 0 4px 0 10px; }
  #karte { height: 52vh; min-height: 280px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--rand); background: var(--karte); }
  .zahlen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .zahl { background: var(--karte); border: 1px solid var(--rand); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .zahl b { display: block; font-size: 20px; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zahl span { color: var(--matt); font-size: 12px; }
  .profil { background: var(--karte); border: 1px solid var(--rand); border-radius: 12px;
    padding: 10px 12px 6px; margin-top: 8px; }
  .profil span { color: var(--matt); font-size: 12px; }
  #profil { display: block; width: 100%; height: 70px; }
  dialog { border: 1px solid var(--rand); border-radius: 14px; background: var(--karte); color: var(--text);
    width: min(92vw, 420px); padding: 16px; }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog label { display: block; font-size: 13px; color: var(--matt); margin: 10px 0 4px; }
  dialog input { width: 100%; font: inherit; padding: 10px; border-radius: 8px;
    border: 1px solid var(--rand); background: var(--bg); color: var(--text); }
  dialog p { font-size: 13px; color: var(--matt); margin: 10px 0 0; }
  .knoepfe { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .knoepfe button { padding: 0 14px; }
</style>
</head>
<body>
<main>
  <div class="hinweis" id="hinweis"></div>
  <header>
    <div><h1 id="titel">Letzte Strecke</h1><div class="wann" id="wann"></div></div>
    <button id="neu" title="Neu laden" aria-label="Neu laden">↻</button>
    <button id="einstellen" title="Einstellungen" aria-label="Einstellungen">⚙</button>
  </header>
  <div class="navi" id="navi" hidden>
    <button id="aelter" title="Älteres Training" aria-label="Älteres Training">‹</button>
    <span id="stelle"></span>
    <button id="neuer" title="Neueres Training" aria-label="Neueres Training">›</button>
  </div>
  <div id="karte"></div>
  <div class="geraete" id="geraete"></div>
  <div class="zahlen" id="zahlen"></div>
  <div class="profil"><span>Höhe</span><svg id="profil" viewBox="0 0 300 70" preserveAspectRatio="none"></svg></div>
</main>

<dialog id="dialog">
  <form method="dialog">
    <b>Zugang</b>
    <label for="repo">Repository der Sammlung (besitzer/name)</label>
    <input id="repo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="besitzer/xgpx-samples">
    <label for="token">GitHub-Token (nur Lesen, nur dieses Repository)</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    <p>Beides bleibt nur auf diesem Gerät.</p>
    <div class="knoepfe"><button value="abbrechen">Abbrechen</button><button value="ok">Speichern</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
"use strict";
const SPEICHER = { repo: "xgpx.repo", token: "xgpx.token", daten: "xgpx.letzte" };
const ARTEN = { run: "Lauf", trail: "Traillauf", walk: "Gehen", hike: "Wandern",
                road: "Rennrad", gravel: "E-Bike", ebike: "E-Bike", mtb: "MTB", cycling: "Rad" };

function lies(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function merke(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* privat: dann eben nicht */ } }
const $ = id => document.getElementById(id);

// --- Rechnen (in den Tests unter node nachgerechnet) ---------------- rechnen:anfang
function zwei(x) { return String(Math.floor(x)).padStart(2, "0"); }
function dauer(s) {
  if (s == null) return "–";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}:${zwei(m)}:${zwei(s % 60)}` : `${m}:${zwei(s % 60)}`;
}
function komma(x, stellen) { return x.toFixed(stellen).replace(".", ","); }
function tempo(d) {
  if (!d.tempo_ms) return ["–", d.zu_fuss ? "min/km" : "km/h"];
  if (!d.zu_fuss) return [komma(d.tempo_ms * 3.6, 1), "km/h"];
  const s = 1000 / d.tempo_ms;
  return [`${Math.floor(s / 60)}:${zwei(Math.round(s % 60) % 60)}`, "min/km"];
}
function datum(iso) {
  if (!iso) return "";
  const t = new Date(iso);
  const tag = t.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  return `${tag}, ${t.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}`;
}
function zahlen(d) {
  const [t, einheit] = tempo(d);
  const liste = [[komma(d.km, 2), "km"], [dauer(d.dauer_s), "Dauer"], [t, einheit]];
  // Höhenmeter aus dem Geländemodell, gleich für jedes Gerät; die der Uhr
  // nur, wo es keine gibt - ohne Luftdruckmesser zählt sie das GPS-Rauschen mit
  if (d.hm_gelaende != null) liste.push([String(d.hm_gelaende), "Höhenmeter"]);
  else if (d.hm != null) liste.push([String(d.hm), "Hm (Uhr)"]);
  if (d.puls != null) liste.push([String(d.puls), "Puls Ø"]);
  if (d.geraet) liste.push([d.geraet, "Gerät"]);
  return liste;
}
function trainings(d) {
  // Fassung 1 (bis 13.11.2026) hatte nur die eine letzte Aufzeichnung
  if (d && d.strecken) return d.strecken.filter(t => t.aufzeichnungen && t.aufzeichnungen.length);
  if (d && d.linie) return [{ aufzeichnungen: [d] }];
  return [];
}
function profil(linie) {
  // Höhe über der Strecke, nicht über der Punktnummer: ein Punkt je 5 m
  // stimmt nur, wo die Uhr nicht stand
  const meter = [0];
  for (let i = 1; i < linie.length; i++) {
    const [a, b] = linie[i - 1], [c, e] = linie[i];
    const k = Math.cos(a * Math.PI / 180);
    meter.push(meter[i - 1] + Math.hypot((c - a) * 111320, (e - b) * 111320 * k));
  }
  const mit = linie.map((p, i) => [meter[i], p[2]]).filter(p => p[1] != null);
  if (mit.length < 2) return "";
  const hs = mit.map(p => p[1]), lo = Math.min(...hs), hi = Math.max(...hs) || lo + 1;
  const ende = meter[meter.length - 1] || 1, spanne = (hi - lo) || 1;
  return mit.map(([m, h]) => `${(m / ende * 300).toFixed(1)},${(64 - (h - lo) / spanne * 56).toFixed(1)}`).join(" ");
}
// ------------------------------------------------------------------- rechnen:ende

let karte = null, daten = null, stelle = 0;
function farbe(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function zeigen(d) {
  daten = trainings(d);
  if (!daten.length) return;
  stelle = Math.min(stelle, daten.length - 1);
  $("navi").hidden = daten.length < 2;
  $("stelle").textContent = `${stelle + 1} / ${daten.length}`;
  $("aelter").disabled = stelle >= daten.length - 1;
  $("neuer").disabled = stelle === 0;
  zeichnen(daten[stelle].aufzeichnungen);
}
function zeichnen(aufzeichnungen) {
  // Die Zahlen und das Profil von der ersten; weitere Geraete desselben
  // Trainings als zweite Linie auf der Karte
  const d = aufzeichnungen[0];
  $("titel").textContent = d.name || ARTEN[d.art] || "Letzte Strecke";
  $("wann").textContent = [ARTEN[d.art], datum(d.start)].filter(Boolean).join(" · ");
  const felder = zahlen(d);
  $("zahlen").innerHTML = felder.map(() => `<div class="zahl"><b></b><span></span></div>`).join("");
  felder.forEach(([w, n], i) => {
    const el = $("zahlen").children[i], b = el.querySelector("b");
    b.textContent = w;
    // "Forerunner 735XT" passt in groß nicht in ein Drittel der Breite
    if (w.length > 8) { b.style.fontSize = "14px"; b.style.whiteSpace = "normal"; }
    el.querySelector("span").textContent = n;
  });
  const farben = [farbe("--linie"), farbe("--zweite")];
  const linie = farben[0];
  $("geraete").innerHTML = "";
  if (aufzeichnungen.length > 1) {
    aufzeichnungen.forEach((a, i) => {
      const f = document.createElement("i");
      f.style.background = farben[Math.min(i, 1)];
      $("geraete").append(f, `${a.geraet || "Gerät " + (i + 1)} ${komma(a.km, 2)} km`);
    });
  }
  const punkte = profil(d.linie);
  $("profil").innerHTML = punkte ?
    `<polygon points="0,70 ${punkte} 300,70" fill="${linie}" opacity="0.18"/>` +
    `<polyline points="${punkte}" fill="none" stroke="${linie}" stroke-width="2" vector-effect="non-scaling-stroke"/>` : "";
  const lagen = d.linie.map(p => [p[0], p[1]]);
  if (window.maplibregl) {
    try { karteZeichnen(aufzeichnungen, farben); return; } catch (e) { karte = null; /* ohne WebGL */ }
  }
  svgSpur(lagen, linie);
}
let karteBereit = null;
function karteZeichnen(aufzeichnungen, farben) {
  // [lon, lat] - MapLibre will die Länge zuerst
  const linien = aufzeichnungen.map(a => a.linie.map(p => [p[1], p[0]]));
  const haupt = linien[0];
  if (!karte) {
    $("karte").innerHTML = "";
    karte = new maplibregl.Map({
      container: "karte", center: haupt[0], zoom: 13, attributionControl: { compact: true },
      style: { version: 8,
        sources: { osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                          tileSize: 256, maxzoom: 19, attribution: "© OpenStreetMap-Mitwirkende" } },
        layers: [{ id: "osm", type: "raster", source: "osm" }] },
    });
    karteBereit = new Promise(fertig => karte.on("load", () => {
      const leer = { type: "FeatureCollection", features: [] };
      karte.addSource("spuren", { type: "geojson", data: leer });
      karte.addLayer({ id: "spuren", type: "line", source: "spuren",
        layout: { "line-join": "round", "line-cap": "round", "line-sort-key": ["get", "rang"] },
        paint: { "line-color": ["get", "farbe"], "line-width": ["get", "breite"], "line-opacity": 0.95 } });
      karte.addSource("enden", { type: "geojson", data: leer });
      karte.addLayer({ id: "enden", type: "circle", source: "enden",
        paint: { "circle-radius": 6, "circle-color": ["get", "farbe"],
                 "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
      fertig();
    }));
  }
  karteBereit.then(() => {
    const linie = (lage, eigen) => ({ type: "Feature", properties: eigen,
                                     geometry: { type: "LineString", coordinates: lage } });
    const punkt = (lage, f) => ({ type: "Feature", properties: { farbe: f },
                                  geometry: { type: "Point", coordinates: lage } });
    // Die erste Aufzeichnung obenauf, die weiteren Geräte darunter
    karte.getSource("spuren").setData({ type: "FeatureCollection", features: linien.map((l, i) =>
      linie(l, i ? { farbe: farben[1], breite: 4, rang: 0 } : { farbe: farben[0], breite: 5, rang: 1 })) });
    karte.getSource("enden").setData({ type: "FeatureCollection", features: [
      punkt(haupt[0], farbe("--start")), punkt(haupt[haupt.length - 1], farben[0])] });
    const rahmen = new maplibregl.LngLatBounds(haupt[0], haupt[0]);
    haupt.forEach(p => rahmen.extend(p));
    karte.fitBounds(rahmen, { padding: 24, animate: false, maxZoom: 17 });
  });
}
function svgSpur(lagen, linie) {
  // Ohne MapLibre (kein Netz beim ersten Start, kein WebGL): die Linie ohne Karte
  const box = $("karte"), b = box.clientWidth || 340, h = box.clientHeight || 300, rand = 24;
  const kx = Math.cos(lagen[0][0] * Math.PI / 180);
  const xs = lagen.map(p => p[1] * kx), ys = lagen.map(p => p[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const m = Math.min((b - 2 * rand) / ((x1 - x0) || 1e-9), (h - 2 * rand) / ((y1 - y0) || 1e-9));
  const dx = (b - (x1 - x0) * m) / 2, dy = (h - (y1 - y0) * m) / 2;
  const pkt = lagen.map((p, i) => `${(dx + (xs[i] - x0) * m).toFixed(1)},${(h - dy - (ys[i] - y0) * m).toFixed(1)}`);
  box.innerHTML = `<svg viewBox="0 0 ${b} ${h}" style="width:100%;height:100%"><polyline points="${pkt.join(" ")}"
    fill="none" stroke="${linie}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

async function holen() {
  const repo = lies(SPEICHER.repo), token = lies(SPEICHER.token);
  if (!repo || !token) { einstellen(); return; }
  $("hinweis").textContent = "";
  try {
    const antwort = await fetch(`https://api.github.com/repos/${repo}/contents/mobile/letzte.json`, {
      headers: { Accept: "application/vnd.github.raw+json", Authorization: `Bearer ${token}` },
      cache: "no-store",
    });
    if (antwort.status === 401 || antwort.status === 403)
      throw new Error("Token abgelehnt - abgelaufen oder ohne Leserecht auf das Repository");
    if (antwort.status === 404)
      throw new Error("mobile/letzte.json nicht gefunden - Repository richtig? Hat xgpx schon abgeglichen?");
    if (!antwort.ok) throw new Error(`GitHub antwortet ${antwort.status}`);
    const text = await antwort.text();
    const d = JSON.parse(text);
    merke(SPEICHER.daten, text);
    zeigen(d);
  } catch (fehler) {
    const alt = lies(SPEICHER.daten);
    if (alt) {
      zeigen(JSON.parse(alt));
      $("hinweis").textContent = `Gespeicherter Stand - ${fehler.message || fehler}`;
    } else {
      $("hinweis").textContent = String(fehler.message || fehler);
    }
  }
}

function einstellen() {
  $("repo").value = lies(SPEICHER.repo);
  $("token").value = lies(SPEICHER.token);
  $("dialog").showModal();
}
$("dialog").addEventListener("close", () => {
  if ($("dialog").returnValue !== "ok") return;
  merke(SPEICHER.repo, $("repo").value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, ""));
  merke(SPEICHER.token, $("token").value.trim());
  holen();
});
$("einstellen").addEventListener("click", einstellen);
$("neu").addEventListener("click", holen);
$("aelter").addEventListener("click", () => { stelle++; zeigen({ strecken: daten }); });
$("neuer").addEventListener("click", () => { stelle = Math.max(0, stelle - 1); zeigen({ strecken: daten }); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) holen(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const gemerkt = lies(SPEICHER.daten);
if (gemerkt) { try { zeigen(JSON.parse(gemerkt)); } catch (e) { /* kaputt: gleich neu */ } }
holen();
</script>
</body>
</html>
